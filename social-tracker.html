<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCA Social Media Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1f3d;
    --navy-soft: #1a3563;
    --burgundy: #7a1f2b;
    --green: #1f6b3a;
    --bg: #f6f4ef;
    --surface: #ffffff;
    --border: #e2ddd1;
    --border-strong: #c9c2b2;
    --text: #0a1f3d;
    --text-muted: #6b6557;
    --eyebrow: #2563eb;
    --status-drafted: #b8881a;
    --status-drafted-bg: #fdf4d9;
    --status-posted: #1f6b3a;
    --status-posted-bg: #e1f1e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 24px 40px;
  }

  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--eyebrow);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--navy);
    line-height: 1;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    max-width: 720px;
    margin: 0 0 18px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .filters { display: flex; gap: 4px; }

  .filter-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text-muted);
    cursor: pointer;
  }

  .filter-btn:hover { color: var(--navy); border-color: var(--navy); }

  .filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

  .btn-add {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 14px;
    background: var(--burgundy);
    color: white;
    border: none;
    cursor: pointer;
  }

  .btn-add:hover { background: #5e1722; }

  .stats-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .stat { display: flex; flex-direction: column; gap: 1px; }

  .stat-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 16px;
    color: var(--navy);
  }

  .stat-value.drafted { color: var(--status-drafted); }
  .stat-value.posted { color: var(--status-posted); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  thead tr { background: var(--navy); }

  th {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: white;
    text-align: left;
    padding: 10px 14px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  th:last-child { border-right: none; }

  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: #faf8f3; }
  tbody tr:hover { background: #f3eee2; }

  td {
    padding: 12px 14px;
    vertical-align: middle;
    font-size: 13px;
    border-right: 1px solid var(--border);
  }

  td:last-child { border-right: none; }

  .col-image { width: 110px; text-align: center; }

  .thumb {
    width: 80px;
    height: 50px;
    object-fit: cover;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    display: inline-block;
    vertical-align: middle;
    background: #fafaf7;
    transition: transform 0.15s, border-color 0.15s;
  }

  .thumb:hover { transform: scale(1.05); border-color: var(--navy); }

  .col-caption { line-height: 1.5; color: var(--text); font-size: 13px; }
  .col-caption p { margin: 0 0 6px; }
  .col-caption p:last-child { margin-bottom: 0; }

  .col-status { width: 130px; }

  .status-select {
    width: 100%;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 22px 6px 10px;
    background-color: var(--status-drafted-bg);
    color: var(--status-drafted);
    border: 1px solid currentColor;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='2'%3e%3cpath d='M4 6l4 4 4-4'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 6px center;
    background-size: 12px;
  }

  .status-select[data-status="drafted"] { background-color: var(--status-drafted-bg); color: var(--status-drafted); }
  .status-select[data-status="posted"] { background-color: var(--status-posted-bg); color: var(--status-posted); }

  .col-actions { width: 40px; }

  .delete-btn {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text-muted);
    width: 22px;
    height: 22px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
  }

  .delete-btn:hover { background: var(--burgundy); color: white; border-color: var(--burgundy); }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 13px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 31, 61, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 560px;
    padding: 28px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 18px;
    color: var(--navy);
  }

  .form-group { margin-bottom: 14px; }

  .form-group label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .form-group input[type="file"] {
    width: 100%;
    padding: 8px;
    border: 1px dashed var(--border-strong);
    background: #fafaf7;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
  }

  .form-group textarea {
    min-height: 140px;
    resize: vertical;
    line-height: 1.5;
  }

  .form-group textarea:focus, .form-group select:focus {
    outline: none;
    border-color: var(--navy);
  }

  .preview-box {
    margin-top: 8px;
    padding: 8px;
    background: #fafaf7;
    border: 1px solid var(--border);
    text-align: center;
    display: none;
  }

  .preview-box.active { display: block; }

  .preview-box img {
    max-width: 100%;
    max-height: 200px;
    border: 1px solid var(--border);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .btn-cancel, .btn-save {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 16px;
    border: 1px solid;
    cursor: pointer;
  }

  .btn-cancel {
    background: var(--surface);
    color: var(--text-muted);
    border-color: var(--border-strong);
  }

  .btn-cancel:hover { color: var(--navy); border-color: var(--navy); }

  .btn-save {
    background: var(--green);
    color: white;
    border-color: var(--green);
  }

  .btn-save:hover { background: #155225; border-color: #155225; }

  .char-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    margin-top: 4px;
  }

  .char-count.over { color: var(--burgundy); font-weight: 600; }

  #previewImg { width: 100%; border: 1px solid var(--border); margin-bottom: 12px; }

  @media (max-width: 800px) {
    .container { padding: 16px; }
    h1 { font-size: 26px; }
    .col-image { width: 80px; }
    .thumb { width: 60px; height: 40px; }
    td { padding: 8px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="eyebrow">Full Court Analytics</div>
  <h1>Social Media Tracker</h1>
  <p class="subtitle">Upload a graphic, write the caption, mark it drafted or posted.</p>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">Total</span>
      <span class="stat-value" id="stat-total">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Drafted</span>
      <span class="stat-value drafted" id="stat-drafted">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Posted</span>
      <span class="stat-value posted" id="stat-posted">0</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="drafted">Drafted</button>
      <button class="filter-btn" data-filter="posted">Posted</button>
    </div>
    <button class="btn-add" id="addBtn">+ New Post</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Tweet / Caption</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="previewOverlay">
  <div class="modal" style="max-width:640px;">
    <h2>Preview</h2>
    <img id="previewImg" src="" alt="">
    <div class="modal-actions">
      <button class="btn-cancel" id="previewClose">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>New Social Post</h2>
    <div class="form-group">
      <label>Image</label>
      <input type="file" id="f-image-file" accept="image/*">
      <div class="preview-box" id="imgPreview">
        <img id="imgPreviewImg" src="" alt="">
      </div>
    </div>
    <div class="form-group">
      <label>Tweet / Caption</label>
      <textarea id="f-caption" placeholder="Write your caption here. Blank lines create paragraph breaks."></textarea>
      <div class="char-count"><span id="charCount">0</span> / 280</div>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="f-status">
        <option value="drafted">Drafted</option>
        <option value="posted">Posted</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save Post</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'fca_social_tracker_v2';

  let posts = [];
  let currentFilter = 'all';
  let pendingImage = '';

  function load() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      posts = stored ? JSON.parse(stored) : [];
    } catch (e) { posts = []; }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    } catch (e) {
      alert('Could not save. Storage may be full from large images.');
    }
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatCaption(text) {
    if (!text) return '<span style="color:var(--text-muted);font-style:italic;">No caption</span>';
    return text.split(/\n\s*\n/).map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
  }

  function placeholderSVG() {
    return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 50'><rect width='80' height='50' fill='#0a1f3d'/><text x='40' y='30' text-anchor='middle' font-family='Barlow Condensed, sans-serif' font-size='10' letter-spacing='1' fill='#2563eb'>FCA</text></svg>`)}`;
  }

  function render() {
    const tbody = document.getElementById('tableBody');
    const filtered = currentFilter === 'all' ? posts : posts.filter(p => p.status === currentFilter);

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty">No posts yet. Click "+ New Post" to add one.</td></tr>`;
    } else {
      tbody.innerHTML = filtered.map(p => `
        <tr data-id="${p.id}">
          <td class="col-image">
            <img class="thumb" src="${p.image || placeholderSVG()}" alt="" data-id="${p.id}" title="Click to preview">
          </td>
          <td class="col-caption">${formatCaption(p.caption)}</td>
          <td class="col-status">
            <select class="status-select" data-status="${p.status}" data-id="${p.id}">
              <option value="drafted" ${p.status === 'drafted' ? 'selected' : ''}>Drafted</option>
              <option value="posted" ${p.status === 'posted' ? 'selected' : ''}>Posted</option>
            </select>
          </td>
          <td class="col-actions">
            <button class="delete-btn" data-id="${p.id}" title="Delete">×</button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('stat-total').textContent = posts.length;
    document.getElementById('stat-drafted').textContent = posts.filter(p => p.status === 'drafted').length;
    document.getElementById('stat-posted').textContent = posts.filter(p => p.status === 'posted').length;

    tbody.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', e => {
        const id = parseInt(e.target.dataset.id);
        const post = posts.find(p => p.id === id);
        if (post) {
          post.status = e.target.value;
          e.target.dataset.status = e.target.value;
          save();
          render();
        }
      });
    });

    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const id = parseInt(e.target.dataset.id);
        if (confirm('Delete this post?')) {
          posts = posts.filter(p => p.id !== id);
          save();
          render();
        }
      });
    });

    tbody.querySelectorAll('.thumb').forEach(img => {
      img.addEventListener('click', () => {
        const id = parseInt(img.dataset.id);
        const post = posts.find(p => p.id === id);
        if (post && post.image) {
          document.getElementById('previewImg').src = post.image;
          document.getElementById('previewOverlay').classList.add('active');
        }
      });
    });
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  const overlay = document.getElementById('modalOverlay');

  function openModal() {
    pendingImage = '';
    document.getElementById('f-image-file').value = '';
    document.getElementById('imgPreview').classList.remove('active');
    document.getElementById('f-caption').value = '';
    document.getElementById('f-status').value = 'drafted';
    document.getElementById('charCount').textContent = '0';
    document.getElementById('charCount').parentElement.classList.remove('over');
    overlay.classList.add('active');
  }

  function closeModal() { overlay.classList.remove('active'); }

  document.getElementById('addBtn').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  document.getElementById('f-image-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      pendingImage = ev.target.result;
      document.getElementById('imgPreviewImg').src = pendingImage;
      document.getElementById('imgPreview').classList.add('active');
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('f-caption').addEventListener('input', e => {
    const len = e.target.value.length;
    const counter = document.getElementById('charCount');
    counter.textContent = len;
    counter.parentElement.classList.toggle('over', len > 280);
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const caption = document.getElementById('f-caption').value.trim();
    if (!caption && !pendingImage) {
      alert('Add an image or caption before saving.');
      return;
    }
    posts.unshift({
      id: Date.now(),
      image: pendingImage,
      caption: caption,
      status: document.getElementById('f-status').value
    });
    save();
    closeModal();
    render();
  });

  const previewOverlay = document.getElementById('previewOverlay');
  document.getElementById('previewClose').addEventListener('click', () => previewOverlay.classList.remove('active'));
  previewOverlay.addEventListener('click', e => { if (e.target === previewOverlay) previewOverlay.classList.remove('active'); });

  load();
  render();
</script>

</body>
</html>
